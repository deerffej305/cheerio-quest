<svg width="800" height="380" viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg">
  <title>Lift Off panel 5 — title card</title>
  <desc>Black title card with stylized game title in warm yellow text. Two Cheerio rings flank the title as decorative elements.</desc>
  <rect width="800" height="380" fill="#1A0F08"/>
  <text x="400" y="155" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#F4B942">JOURNEY TO THE CENTER</text>
  <text x="400" y="215" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#F4B942">OF THE ANUS</text>
  <text x="400" y="275" text-anchor="middle" font-family="serif" font-size="26" font-style="italic" fill="#C8A35A">A Crispy Story</text>
  <circle cx="110" cy="190" r="32" fill="none" stroke="#F4B942" stroke-width="6"/>
  <circle cx="110" cy="190" r="14" fill="none" stroke="#F4B942" stroke-width="4"/>
  <circle cx="690" cy="190" r="32" fill="none" stroke="#F4B942" stroke-width="6"/>
  <circle cx="690" cy="190" r="14" fill="none" stroke="#F4B942" stroke-width="4"/>
