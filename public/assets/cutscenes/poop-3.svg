<svg width="800" height="380" viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg">
  <title>Poop panel 3 — Poop Boss speaks (with baked-in dialogue)</title>
  <desc>Poop Boss mid-speech with dialogue rendered directly on the panel. "Ughhh. No rush, man. I've been hangin out here for a WEEK." appears in a casual rounded speech bubble on the right. Earth-tone anus background.</desc>
  <rect width="800" height="380" fill="#5C3A1A"/>
  <g transform="translate(50, 30) scale(1.0)">
    <path d="M 155,48 Q 150,33 160,28 Q 170,23 155,8" stroke="#A89180" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round"/>
    <path d="M 180,48 Q 185,33 175,28 Q 165,23 180,8" stroke="#A89180" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round"/>
    <path d="M 60,275 Q 40,240 75,220 Q 50,170 110,160 Q 80,110 150,100 Q 125,65 175,65 Q 210,60 200,100 Q 230,130 210,165 Q 255,200 240,240 Q 280,280 220,280 L 60,275 Z" fill="#8B5A2B" stroke="#5C3A1A" stroke-width="3.5"/>
    <ellipse cx="140" cy="150" rx="13" ry="4.5" fill="#FFFFFF" stroke="#3A2417" stroke-width="2"/>
    <ellipse cx="180" cy="150" rx="13" ry="4.5" fill="#FFFFFF" stroke="#3A2417" stroke-width="2"/>
