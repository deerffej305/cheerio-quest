  <path d="M 380,50 L 770,50 Q 784,50 784,64 L 784,210 Q 784,224 770,224 L 470,224 L 410,260 L 440,224 L 380,224 Q 366,224 366,210 L 366,64 Q 366,50 380,50 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3.5"/>
  <text x="575" y="98" text-anchor="middle" font-family="sans-serif" font-size="24" font-style="italic" fill="#1A1A1A">"Ughhh. No rush, man.</text>
  <text x="575" y="138" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#1A1A1A">I've been hangin out</text>
  <text x="575" y="180" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#1A1A1A">here for a <tspan font-weight="bold">WEEK</tspan>."</text>
