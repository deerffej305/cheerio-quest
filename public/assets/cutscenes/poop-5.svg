<svg width="800" height="380" viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg">
  <title>Poop panel 5 — fart countdown</title>
  <desc>Walls shake (dashed motion lines). A large stylized "FART IN 30 SECONDS" timer card fills the panel as the warning. This panel CAN have baked-in text per the brief.</desc>
  <rect width="800" height="380" fill="#5C3A1A"/>
  <path d="M 0,300 L 800,300 L 800,380 L 0,380 Z" fill="#3A2417"/>
  <path d="M 0,40 L 800,40" stroke="#A89180" stroke-width="3" stroke-dasharray="10,10" opacity="0.7"/>
  <path d="M 0,55 L 800,55" stroke="#A89180" stroke-width="2.5" stroke-dasharray="8,8" opacity="0.5"/>
  <path d="M 0,340 L 800,340" stroke="#A89180" stroke-width="3" stroke-dasharray="10,10" opacity="0.7"/>
  <rect x="180" y="120" width="440" height="140" rx="18" fill="#1A0F08" stroke="#F4B942" stroke-width="5"/>
  <text x="400" y="170" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#F4B942">FART IN</text>
  <text x="400" y="230" text-anchor="middle" font-family="sans-serif" font-size="56" font-weight="bold" fill="#FFD93D">30 SECONDS</text>
</svg>
