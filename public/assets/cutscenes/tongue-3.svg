    <circle cx="480" cy="92" r="3" fill="#C7637C" opacity="0.55"/>
    <circle cx="380" cy="85" r="2.5" fill="#C7637C" opacity="0.55"/>
    <circle cx="380" cy="135" r="2.5" fill="#C7637C" opacity="0.55"/>
    <circle cx="220" cy="92" r="2.5" fill="#C7637C" opacity="0.55"/>
    <circle cx="540" cy="135" r="3" fill="#C7637C" opacity="0.55"/>
    <ellipse cx="75" cy="110" rx="15" ry="18" fill="#FFFFFF" stroke="#3A2417" stroke-width="2.2"/>
    <ellipse cx="115" cy="110" rx="15" ry="18" fill="#FFFFFF" stroke="#3A2417" stroke-width="2.2"/>
    <circle cx="69" cy="110" r="8" fill="#1A1A1A"/>
