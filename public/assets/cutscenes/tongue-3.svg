    <path d="M 130,90 L 98,99" stroke="#3A2417" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <path d="M 350,30 L 780,30 Q 790,30 790,40 L 790,195 Q 790,205 780,205 L 500,205 L 380,260 L 460,205 L 350,205 Q 340,205 340,195 L 340,40 Q 340,30 350,30 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3.5"/>
  <text x="565" y="78" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1A1A1A">WAIT—— what...</text>
  <text x="565" y="110" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1A1A1A">what ARE you?</text>
  <text x="565" y="145" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1A1A1A">...doesn't matter.</text>
  <text x="565" y="183" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#C0202A">GET CRUSHED, SNACK!</text>
