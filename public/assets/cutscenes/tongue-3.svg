<svg width="800" height="380" viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg">
  <title>Tongue cut scene panel 3 — tongue speaks (with baked-in dialogue)</title>
  <desc>Tongue boss mid-speech with dialogue rendered directly on the panel. "WAIT— what... what ARE you? ...doesn't matter. GET CRUSHED, SNACK!" appears in a jagged speech bubble in the upper right. Pink mouth background with darker floor strip.</desc>
  <rect width="800" height="380" fill="#FFC8D0"/>
