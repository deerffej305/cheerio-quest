  <line x1="10" y1="50" x2="70" y2="50" stroke="#D4B080" stroke-width="2"/>
  <line x1="10" y1="90" x2="70" y2="90" stroke="#D4B080" stroke-width="2"/>
  <line x1="10" y1="130" x2="70" y2="130" stroke="#D4B080" stroke-width="2"/>
  <line x1="10" y1="170" x2="70" y2="170" stroke="#D4B080" stroke-width="2"/>
  <line x1="40" y1="10" x2="40" y2="50" stroke="#D4B080" stroke-width="2"/>
  <line x1="25" y1="50" x2="25" y2="90" stroke="#D4B080" stroke-width="2"/>
  <line x1="55" y1="50" x2="55" y2="90" stroke="#D4B080" stroke-width="2"/>
  <line x1="40" y1="90" x2="40" y2="130" stroke="#D4B080" stroke-width="2"/>
  <line x1="25" y1="130" x2="25" y2="170" stroke="#D4B080" stroke-width="2"/>
  <line x1="55" y1="130" x2="55" y2="170" stroke="#D4B080" stroke-width="2"/>
  <line x1="40" y1="170" x2="40" y2="210" stroke="#D4B080" stroke-width="2"/>
</svg>
