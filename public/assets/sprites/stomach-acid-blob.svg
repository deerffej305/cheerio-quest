  <title>Stomach Acid Blob — boss, idle / mouth closed</title>
  <desc>Stomach-room boss. Tall green gelatin tower with two finger peaks at the top, hanging jelly arms with rounded hands, and a wide base intended to emerge from the room's acid pit. Angry red eye orbs, dark green slash brows, jagged clenched-teeth mouth. Internal darker shapes and white bubbles for the translucent gelatin look. Renders at ~140 wide in-game.</desc>
